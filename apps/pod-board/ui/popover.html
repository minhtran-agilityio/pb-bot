<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pod Board</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* The menu bar popover: who needs you and what is running, one click from the menu bar. UDS v3.0 tokens (theme.css). */
  body { overflow: hidden; font-size: 13px; line-height: 20px; -webkit-user-select: none; user-select: none; cursor: default; }
  .ic { stroke-width: 1.75; }
  .wrap { height: 100%; display: flex; flex-direction: column; }
  header { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
  /* The cat as a still picture, in the round tile of the AppCharacter. */
  .mascot { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--side); box-shadow: var(--card-sh); color: var(--danger); font-size: 16px; }
  .mascot .cat { display: block; width: 32px; height: 32px; overflow: visible; }
  .mascot.warn .cat { display: none; }
  .mascot:not(.warn) .ic { display: none; }
  :root[data-theme="dark"] .mascot .cat { filter: drop-shadow(0 0 .6px var(--fg-subtle)) drop-shadow(0 0 .6px var(--fg-subtle)); }
  .cat .s { fill: var(--pod-brand-cat); }
  .cat .tail { fill: none; stroke: var(--pod-brand-cat); stroke-width: 5; stroke-linecap: round; }
  .cat .eye { fill: var(--pod-brand-eye); } .cat .pupil { fill: var(--pod-brand-cat); }
  .head { min-width: 0; flex: 1; }
  .head b { display: block; font-size: 15px; line-height: 24px; }
  .head small { display: block; color: var(--fg-muted); font-size: 12px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px 8px; }
  /* Group title: the soft state pill of the board, with the count. */
  h2 { margin: 8px 4px 6px; display: flex; }
  .pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 10px; border-radius: 9999px; font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; }
  .pill .ic { font-size: 12px; }
  .pill.needs { background: var(--session-needs-soft); color: var(--accent-text); }
  .pill.busy { background: var(--session-working-soft); color: var(--session-working); }
  .pill.busy .ic { animation: spin 1.4s linear infinite; }
  .pill.done { background: var(--session-finished-soft); color: var(--session-finished); }
  /* A row is a small session card. */
  .r { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; width: 100%; text-align: left; margin-bottom: 6px;
    padding: 8px 12px; border-radius: 18px; background: var(--surface-2); border: 1px solid var(--border); box-shadow: var(--card-sh);
    transition: box-shadow var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }
  .r:hover { box-shadow: var(--card-sh-hover); transform: translateY(-2px); }
  .r .t { min-width: 0; font-size: 14px; line-height: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r .w { font-size: 12px; font-weight: 600; color: var(--accent-text); }
  .r.busy .w { color: var(--session-working); }
  .r.done .w { color: var(--session-finished); }
  .r .s { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
  .r .s .txt { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag.sub { background: var(--session-working-soft); color: var(--session-working); }
  .tag { flex: none; display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 9999px; background: var(--session-needs-soft); color: var(--accent-text);
    font-size: 12px; line-height: 16px; font-weight: 500; }
  .r .why { grid-column: 1 / -1; }
  .quiet { margin: 16px 10px 20px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--fg-muted); }
  .quiet .ic { font-size: 16px; }
  .more { margin: 2px 6px 8px; font-size: 12px; color: var(--fg-muted); }
  footer { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 14px 12px; border-top: 1px solid var(--border); }
  footer .c { flex: 1; font-size: 12px; line-height: 16px; color: var(--fg-muted); }
  .btn { display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 9999px; font-size: 13px; font-weight: 500;
    background: var(--accent); color: var(--accent-fg); box-shadow: var(--btn-sh); transition: background-color var(--dur-fast) var(--ease-out); }
  .btn:hover { background: var(--accent-hover); box-shadow: var(--btn-sh-hover); }
</style>
</head>
<body>
<!-- Icons: Lucide, ISC licence (see THIRD-PARTY.md); the same symbols as index.html. -->
<svg class="sprite" aria-hidden="true"><symbol id="i-server" viewBox="0 0 24 24"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></symbol><symbol id="i-monitor" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></symbol><symbol id="i-terminal" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></symbol><symbol id="i-hand" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></symbol><symbol id="i-loader" viewBox="0 0 24 24"><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></symbol><symbol id="i-coffee" viewBox="0 0 24 24"><path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/><path d="M6 2v2"/></symbol><symbol id="i-moon-star" viewBox="0 0 24 24"><path d="M18 5h4"/><path d="M20 3v4"/><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></symbol><symbol id="i-triangle-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol></svg>
<div class="wrap">
  <header>
    <span class="mascot" id="face" aria-hidden="true">
      <!-- Pod Board's cat (see index.html), still: sitting, eyes open. -->
      <svg class="cat" viewBox="14 10 60 64"><path class="tail" d="M55 69 Q74 70 70 50 Q68 43 62 45"/><path class="s" d="M29 45 Q19 58 25 71 L55 71 Q61 58 51 45 Z"/><path class="s" d="M24 36 L22 13 L33 24 Q40 21 47 24 L58 13 L56 36 Q55 48 40 48 Q25 48 24 36 Z"/><ellipse class="eye" cx="33" cy="35" rx="3.6" ry="4.4"/><ellipse class="eye" cx="47" cy="35" rx="3.6" ry="4.4"/><rect class="pupil" x="32.2" y="31.6" width="1.6" height="6.8" rx=".8"/><rect class="pupil" x="46.2" y="31.6" width="1.6" height="6.8" rx=".8"/></svg>
    </span>
    <div class="head"><b id="headline">Pod Board</b><small id="sub">Reading Pod Bay…</small></div>
  </header>
  <main id="list" aria-live="polite"></main>
  <footer><span class="c tab" id="counts"></span><button type="button" class="btn" id="board">Open Pod Board</button></footer>
</div>
<script>
const SHOW = 6; // rows per group; the board has the rest
const MAX_H = 460; // the window never grows past its first size
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
function ic(id) {
  const NS = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(NS, 'svg'); s.setAttribute('class', 'ic'); s.setAttribute('aria-hidden', 'true');
  const u = document.createElementNS(NS, 'use'); u.setAttribute('href', `#i-${id}`); s.append(u); return s;
}
function dur(since) {
  if (!since) return '';
  const m = Math.max(0, Math.round((Date.now() - since) / 60000));
  if (m < 60) return `${m} m`;
  if (m < 1440) return `${Math.floor(m / 60)} h ${m % 60} m`;
  return `${Math.floor(m / 1440)} d ${Math.floor(m % 1440 / 60)} h`;
}
const tauri = () => window.__TAURI__;
const call = (cmd, args) => { const t = tauri(); if (t) t.core.invoke(cmd, args).catch(() => {}); };

// The theme follows the board's choice (same storage), else the system.
function applyTheme() {
  let stored = null; try { stored = localStorage.getItem('pod-board-theme'); } catch (e) { /* no storage */ }
  const dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
addEventListener('storage', applyTheme);
addEventListener('focus', applyTheme);

// Where a session runs: the same outline chip as the board. Only a Pod Bay chip names the machine.
const SRC = { podbay: 'server', desktop: 'monitor', terminal: 'terminal' };
const srcOf = s => (SRC[s.source] ? s.source : 'podbay');
const srcWords = s => { const k = srcOf(s); return k === 'podbay' ? (s.machine ? `Pod Bay · ${s.machine}` : 'Pod Bay') : k === 'terminal' ? 'Terminal · RC' : 'Desktop'; };
const REASON = { permission: 'Permission', question: 'Question', plan: 'Plan approval' };
const nSub = n => `${n} sub-agent${n === 1 ? '' : 's'}`;
const subRun = s => { const a = s.agents; return a ? (Number(a.running) || (a.list || []).filter(x => !x.done).length) : 0; };

function row(s) {
  // A finished session shows how long ago it finished; the others how long they wait or work.
  const b = el('button', `r ${s.finished ? 'done' : s.state}`); b.type = 'button';
  b.append(el('span', 't', s.title), el('span', 'w tab', s.finished ? `${dur(s.finished)} ago` : dur(s.since)));
  const k = REASON[s.reason && s.reason.kind];
  if (s.state === 'needs' && k) { const why = el('p', 'why'); why.append(el('b', null, k)); if (s.reason.detail) why.append(el('code', null, s.reason.detail)); b.append(why); }
  const sub = el('span', 's'); const chip = el('span', 'src'); chip.append(ic(SRC[srcOf(s)]), el('span', null, srcWords(s)));
  sub.append(chip);
  if (s.state === 'needs') sub.append(el('span', 'tag', 'needs you')); // no lane head here says it
  if (s.waiting) sub.append(el('span', 'tag', s.waiting)); // the waiting tag shows next to a reason too, as on the board
  if (s.state === 'busy' && subRun(s)) sub.append(el('span', 'tag sub', nSub(subRun(s))));
  sub.append(el('span', 'txt', (s.state === 'busy' && s.step) || s.what || (s.branch ? `branch ${s.branch}` : s.ws && srcOf(s) === 'podbay' ? `${s.project}/${s.ws}` : s.project)));
  b.append(sub);
  const opens = s.rc_id ? ['open_session', s.rc_id] : s.desktop_id ? ['open_desktop', s.desktop_id] : null;
  b.title = opens ? `Open ${s.title} in Claude` : `${s.title}: open the board`;
  b.addEventListener('click', () => {
    if (opens) { call(opens[0], { id: opens[1] }); call('close_popover'); } else call('show_board');
  });
  return b;
}

function group(state, label, icon, list) {
  if (!list.length) return [];
  const h = el('h2'); const p = el('span', `pill ${state}`); p.append(ic(icon), `${label} · ${list.length}`); h.append(p);
  const out = [h, ...list.slice(0, SHOW).map(row)];
  if (list.length > SHOW) out.push(el('p', 'more', `and ${list.length - SHOW} more on the board`));
  return out;
}

// The window's height follows its rows, up to MAX_H. The top-left corner stays where the app put it.
let fitted = 0;
async function fit() {
  const t = tauri(); if (!t || !t.window || !t.dpi) return;
  // The list fills the window, so its own height says nothing: measure down to the end of its last child instead.
  const list = $('list'), end = list.lastElementChild;
  const content = end ? end.getBoundingClientRect().bottom + parseFloat(getComputedStyle(end).marginBottom) - list.getBoundingClientRect().top + list.scrollTop : 0;
  const h = Math.min(MAX_H, Math.ceil(document.querySelector('header').offsetHeight + content + parseFloat(getComputedStyle(list).paddingBottom) + document.querySelector('footer').offsetHeight));
  if (h === fitted) return;
  fitted = h;
  try {
    const w = t.window.getCurrentWindow();
    // Hidden: only the size. The app places the window under the menu bar icon when it opens it.
    if (!(await w.isVisible())) { await w.setSize(new t.dpi.LogicalSize(340, h)); return; }
    // Shown: keep the top-left corner, whichever corner the system keeps when it resizes. Skip the move if the
    // window was hidden meanwhile, so a stale position never wins over the app's placement.
    const at = await w.outerPosition();
    await w.setSize(new t.dpi.LogicalSize(340, h));
    if (await w.isVisible()) await w.setPosition(at);
  } catch (e) { fitted = 0; }
}

let last = null;
function draw(m) {
  if (!m) return;
  last = m;
  const list = $('list'); list.textContent = '';
  const c = m.counts || { needs: 0, busy: 0, idle: 0, stopped: 0 };
  const needs = m.sessions.filter(s => s.state === 'needs'), busy = m.sessions.filter(s => s.state === 'busy');
  const done = m.sessions.filter(s => s.finished);
  let head = 'Nobody needs you', sub = c.busy ? `${c.busy} working` : 'All quiet';
  if (!m.ok) { head = 'Cannot read Pod Bay'; sub = m.error || 'Showing the last data that was read'; }
  else if (c.needs) { head = `${c.needs} ${c.needs === 1 ? 'session needs' : 'sessions need'} you`; sub = `Longest wait: ${needs[0].title} · ${dur(needs[0].since)}`; }
  else if (done.length) { head = `${done.length} finished`; sub = c.busy ? `${c.busy} working · nobody needs you` : 'Nobody needs you'; }
  const f = $('face'); f.classList.toggle('warn', !m.ok);
  if (!f.querySelector('.ic')) f.append(ic('triangle-alert'));
  $('headline').textContent = head; $('sub').textContent = sub;
  const parts = [...group('needs', 'Needs you', 'hand', needs), ...group('done', 'Finished', 'coffee', done), ...group('busy', 'Working', 'loader', busy)];
  if (parts.length) list.append(...parts);
  else { const q = el('p', 'quiet'); q.append(ic('coffee'), 'Nothing is running. Idle sessions are on the board.'); list.append(q); }
  $('counts').textContent = `${c.needs} need you · ${c.busy} working · ${c.idle} idle${c.finished ? ` · ${c.finished} finished` : ''}`;
  fit();
}

$('board').addEventListener('click', () => call('show_board'));
addEventListener('keydown', e => { if (e.key === 'Escape') call('close_popover'); });
const t = tauri();
if (t) {
  t.event.listen('pods', e => draw(e.payload));
  t.core.invoke('snapshot').then(m => { if (m && (m.read_at || m.error)) draw(m); }).catch(() => {});
}
setInterval(() => draw(last), 60000); // the waits keep counting between reads
</script>
</body>
</html>
