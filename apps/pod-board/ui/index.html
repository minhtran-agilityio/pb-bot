<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pod Board</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Pod Board on the UI design system (UDS v3.0): title bar, sage sidebar, main panel. Tokens in theme.css; notes in ../DESIGN.md.
     No raw colour here: every colour is a token, except inside the Pod Cat logo drawing. */
  body { display: grid; grid-template-rows: 48px minmax(0, 1fr); height: 100vh; overflow: hidden; }
  .ic { stroke-width: 1.75; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* Title bar: the window's own. On macOS the window buttons sit on its left (--tb-inset); a press anywhere on it but the
     button drags the window, and a double-click zooms it. Where the system draws its own title bar (the app on Linux), it is not shown. */
  :root { --tb-inset: 18px; }
  :root.mac { --tb-inset: 84px; }
  :root.native-tb body { grid-template-rows: minmax(0, 1fr); }
  :root.native-tb .titlebar { display: none; }
  .titlebar { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 18px 0 var(--tb-inset); -webkit-user-select: none; user-select: none; }
  .pod-logo { flex: none; display: block; width: 20px; height: 20px; pointer-events: none; }
  .pod-logo .tile { fill: var(--pod-brand-bg); } .pod-logo .body { fill: var(--pod-brand-cat); stroke: var(--pod-brand-cat); } .pod-logo .eye { fill: var(--pod-brand-eye); }
  .crumb { min-width: 0; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-muted); font-size: 14px; }
  .crumb b { color: var(--fg); font-weight: 500; }

  /* Shell: sidebar and main panel, 12 px apart and from the window edge. */
  /* The width changes at once when the sidebar collapses (no transition): the thumb is placed from the new sizes right after. */
  .shell { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); gap: var(--shell-gap); padding: 0 var(--shell-gap) var(--shell-gap); min-height: 0; }
  .shell.collapsed { grid-template-columns: 64px minmax(0, 1fr); }
  @media (max-width: 860px) { .shell { grid-template-columns: 64px minmax(0, 1fr); } #sidebar { display: none; } }

  /* Sidebar */
  .side { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; padding: 16px 10px 12px; border-radius: 28px; background: var(--side); overflow: hidden; }
  /* The list scrolls by itself, so the status box always stays in view. A small inset keeps each focus ring visible. */
  .nav { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 2px; padding: 3px; overflow: hidden auto; scrollbar-width: thin; }
  .nav > * { flex: none; }
  .nav.fade { -webkit-mask-image: linear-gradient(to bottom, black calc(100% - 36px), transparent); mask-image: linear-gradient(to bottom, black calc(100% - 36px), transparent); }
  .group { margin: 0; padding: 14px 12px 6px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--fg-muted); }
  .thumb { position: absolute; left: 0; top: 0; height: 38px; border-radius: 9999px; background: var(--surface-2); box-shadow: var(--card-sh); pointer-events: none;
    transition: transform var(--dur-base) var(--ease-out), height var(--dur-base) var(--ease-out); }
  .item { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; padding: 0 12px; border-radius: 9999px;
    font-size: 14px; line-height: 22px; font-weight: 500; text-align: left; color: var(--fg); transition: background-color var(--dur-fast) var(--ease-out); }
  .item:hover { background: var(--side-hover); }
  .item[aria-current="page"] { font-weight: 600; }
  .item[aria-current="page"]:hover { background: transparent; }
  .item .ico { flex: none; display: grid; place-items: center; width: 16px; font-size: 16px; color: var(--fg-muted); }
  .item[aria-current="page"] .ico { color: var(--fg); }
  .item .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .n { flex: none; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 9999px; font-size: 13px; line-height: 22px; font-weight: 500; text-align: center; color: var(--fg-muted); }
  .item[data-hot="1"] .n { background: var(--session-needs-soft); color: var(--accent-text); }
  /* Machine rows are filters, not pages: a little lower, so the whole list fits a short window. */
  .item.sub { height: 34px; font-size: 13px; line-height: 20px; }
  .item.sub[data-on="1"] { background: var(--surface-2); box-shadow: var(--card-sh); font-weight: 600; }
  .item.clear { justify-content: center; color: var(--fg-muted); text-decoration: underline; text-underline-offset: 3px; }
  .item .dot { flex: none; width: 8px; height: 8px; margin: 0 4px; border-radius: 50%; background: var(--success); }
  .item .dot.hot { background: var(--accent); }
  .item .dot.quiet { background: var(--border-strong); }
  .item .dot.off { background: transparent; border: 1.5px dashed var(--fg-subtle); }
  .item .dot.warn { border-color: var(--warning); }

  /* SidebarStatus: state dot and word, then the read time and Pause. */
  .sstat { flex: none; display: grid; gap: 4px; padding: 12px; border-radius: 18px; background: var(--surface-2); box-shadow: var(--card-sh); }
  #conn { display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 20px; font-weight: 500; }
  #conn i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
  #conn[data-s="stale"] i, #conn[data-s="wait"] i, #conn[data-s="paused"] i { background: var(--warning); }
  #conn[data-s="error"] i { background: var(--danger); }
  .sstat .l2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-left: 16px; font-size: 12px; line-height: 16px; color: var(--fg-muted); }
  #pause { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border-radius: 9999px; font-size: 12px; font-weight: 500; color: var(--fg);
    transition: background-color var(--dur-fast) var(--ease-out); }
  #pause:hover, #pause[aria-pressed="true"] { background: var(--surface-3); }
  #pause .ic { font-size: 12px; }
  .dnd { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 12px; background: var(--warning-soft); font-size: 12px; line-height: 16px; font-weight: 500; }
  .dnd[hidden] { display: none; } /* the flex rule above would otherwise show it while off */
  .dnd button { font-size: 12px; font-weight: 600; color: var(--accent-text); text-decoration: underline; text-underline-offset: 3px; }
  .side-foot { flex: none; display: flex; justify-content: center; padding-top: 8px; border-top: 1px solid var(--border); }

  /* Segmented control: a pressed track, the chosen option raised on it. */
  .seg { flex: none; display: inline-flex; gap: 2px; padding: 3px; border-radius: 9999px; background: var(--surface-3); box-shadow: var(--pressed-sh); }
  .seg button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 9999px; font-size: 13px; font-weight: 500; color: var(--fg-muted);
    transition: background-color var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out); }
  .seg button .ic { font-size: 16px; }
  .seg.icons button { padding: 0 8px; }
  .seg button:hover { color: var(--fg); }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); box-shadow: var(--card-sh); }
  @media (max-width: 620px) { .seg button span { display: none; } .seg button { padding: 0 10px; } }
  .iconbtn { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 9999px; font-size: 16px; color: var(--fg-muted);
    transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
  .iconbtn.sm { width: 30px; height: 30px; }
  .iconbtn:hover { background: var(--surface-3); color: var(--fg); }
  #refresh.spin .ic { animation: spin .8s linear infinite; }

  /* Icon-only sidebar: collapsed by the owner (button or ⌘B), and always in a narrow window. */
  .shell.collapsed .side { padding: 12px 8px; align-items: center; }
  .shell.collapsed :is(.item .lbl, .item .n, .group, .sstat .l2 #read, #pause span, #connText, .dnd #dndText) { display: none; }
  .shell.collapsed :is(.item) { justify-content: center; width: 38px; padding: 0; }
  .shell.collapsed .nav { align-items: center; }
  .shell.collapsed .sstat { padding: 8px; justify-items: center; background: none; box-shadow: none; }
  .shell.collapsed .sstat .l2 { padding: 0; }
  .shell.collapsed .side .seg { flex-direction: column; }
  .shell.collapsed .dnd { padding: 6px; }
  @media (max-width: 860px) {
    .side { padding: 12px 8px; align-items: center; }
    :is(.item .lbl, .item .n, .group, .sstat .l2 #read, #pause span, #connText, .dnd #dndText) { display: none; }
    .item { justify-content: center; width: 38px; padding: 0; }
    .nav { align-items: center; }
    .sstat { padding: 8px; justify-items: center; background: none; box-shadow: none; }
    .sstat .l2 { padding: 0; }
    .side .seg { flex-direction: column; }
  }

  /* Main panel */
  main { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 16px; padding: 24px 28px 28px; border-radius: 28px; background: var(--surface-1); overflow: auto; }
  @media (max-width: 860px) { main { padding: 16px; } }
  .page-h { flex: none; display: flex; align-items: center; gap: 12px; }
  .page-h h1 { margin: 0; min-width: 0; font-size: 26px; line-height: 34px; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #titleState { display: flex; align-items: center; gap: 8px; margin-right: auto; }
  #titleState b { font-size: 18px; line-height: 26px; }
  #banner { display: none; flex: none; margin: 0; padding: 10px 16px; border-radius: 18px; background: var(--danger-soft); font-size: 13px; line-height: 20px; font-weight: 500; }
  #banner.on { display: block; }
  #summary, #view { transition: opacity var(--dur-base) var(--ease-out); }
  :is(#summary, #view).dim { opacity: .55; }
  #view { flex: 1; display: flex; flex-direction: column; gap: 16px; }
  #view.enter { animation: enter var(--dur-base) var(--ease-out); }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } }

  /* SummaryRow with the AppCharacter: one sentence, one sub line, the other counts as quiet buttons. */
  .summary { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 24px; background: var(--surface-2);
    border: 1px solid var(--border); box-shadow: var(--card-sh); }
  .summary[hidden] { display: none; }
  .mascot { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--side); box-shadow: var(--card-sh); }
  .words { flex: 1 1 240px; min-width: 0; }
  .words h2 { margin: 0; font-size: 15px; line-height: 24px; }
  .words p { margin: 0; font-size: 13px; line-height: 20px; color: var(--fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .counts { flex: none; display: flex; flex-wrap: wrap; gap: 6px; }
  .count { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 10px; border-radius: 9999px; background: var(--surface-3); font-size: 12px; line-height: 16px;
    font-weight: 500; color: var(--fg-muted); transition: color var(--dur-fast) var(--ease-out); }
  .count b { color: var(--fg); }
  .count:hover { color: var(--fg); }
  @media (max-width: 620px) { .counts { display: none; } }

  /* State pill: soft fill + icon + word, the same in the lane head, the list group, the page head and the peek. */
  .pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 10px; border-radius: 9999px; font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; }
  .pill .ic { font-size: 12px; }
  .pill.needs { background: var(--session-needs-soft); color: var(--accent-text); }
  .pill.busy { background: var(--session-working-soft); color: var(--session-working); }
  .pill.idle { background: var(--session-idle-soft); color: var(--session-idle); }
  .pill.stopped { border: 1px solid var(--border-strong); color: var(--fg-muted); }
  :is(.pill.busy, .sic.busy) .ic { animation: spin 1.4s linear infinite; }

  /* Lanes: neutral, on the page colour; the state shows in the pill. */
  .lanes { display: grid; gap: 12px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
  @media (max-width: 1040px) { .lanes { grid-template-columns: minmax(0, 1fr); } }
  .lane { min-width: 0; padding: 12px; border-radius: 24px; background: var(--bg); }
  .lane-h { display: flex; align-items: center; gap: 8px; margin: 2px 6px 10px; font-size: 14px; }
  .lane-h .n { margin-left: auto; font-size: 18px; line-height: 26px; font-weight: 600; }
  .more { margin: 10px 6px 2px; font-size: 13px; font-weight: 500; color: var(--fg-muted); text-decoration: underline; text-underline-offset: 4px; }
  .more:hover { color: var(--fg); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  ul.wide { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .none { margin: 6px; color: var(--fg-muted); font-size: 13px; }

  /* SessionCard. Row 1: title, time, peek. Then the body (what it does) and the meta row (place and tags), then links.
     New parts for a session (reason, step, sub-agents) go between row 1 and the meta row. */
  .row { position: relative; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 16px 20px; border-radius: 24px; background: var(--surface-2);
    border: 1px solid var(--border); box-shadow: var(--card-sh); transition: transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out); }
  .row.link { cursor: pointer; }
  .row.link:hover { transform: translateY(-3px); box-shadow: var(--card-sh-hover); }
  .row.flash, .lrow.flash { animation: flash 1.2s ease-out 1; }
  @keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: 0 0 0 3px transparent; } }
  .rtop { display: flex; align-items: baseline; gap: 8px; }
  .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; line-height: 24px; font-weight: 600; }
  .wait { flex: none; font-size: 13px; line-height: 20px; font-weight: 600; color: var(--accent-text); }
  .when { flex: none; font-size: 13px; line-height: 20px; color: var(--fg-subtle); }
  .what { margin: 0; font-size: 13px; line-height: 20px; color: var(--fg-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .what.fallback { font-style: italic; color: var(--fg-subtle); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .where { font-size: 13px; line-height: 20px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
  /* Tags and link buttons: 22 px pills. */
  .tag { display: inline-flex; align-items: center; height: 22px; padding: 0 10px; border-radius: 9999px; background: var(--surface-3); color: var(--fg-muted);
    font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; }
  .tag.wait { background: var(--session-needs-soft); color: var(--accent-text); }
  .tag.done { background: var(--session-finished-soft); color: var(--session-finished); }
  /* A session's links (pull requests, issues, artifacts): small buttons that open the page in the browser. */
  .links { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .lk { display: inline-flex; align-items: center; max-width: 14rem; height: 22px; padding: 0 10px; border-radius: 9999px; border: 1px solid var(--border-strong);
    color: var(--accent-text); font-size: 12px; line-height: 16px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: background-color var(--dur-fast) var(--ease-out); }
  .lk:hover { background: var(--surface-3); }
  .lk.more { margin: 0; border-style: dashed; color: var(--fg-muted); text-decoration: none; cursor: default; }
  .lrow .links { flex: none; flex-wrap: nowrap; margin-left: 8px; }

  /* List layout: one card, one dense row per session, grouped under a state pill. */
  .list { padding: 6px 0; border-radius: 24px; background: var(--surface-2); border: 1px solid var(--border); box-shadow: var(--card-sh); overflow: hidden; }
  .lgroup { display: flex; align-items: center; gap: 10px; padding: 12px 18px 6px; }
  .lgroup .n { font-size: 13px; color: var(--fg-muted); }
  .lrow { display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 1fr) minmax(0, 14rem) 6.5rem; align-items: center; gap: 4px 16px; min-height: 50px;
    padding: 8px 18px; border-top: 1px solid var(--border); font-size: 13px; line-height: 20px; transition: background-color var(--dur-fast) var(--ease-out); }
  .lrow.link { cursor: pointer; }
  .lrow.link:hover { background: var(--surface-3); }
  .lt { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 14px; font-weight: 600; }
  .lt > span:not(.sic):not(.srci) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lt .peekbtn { margin-left: auto; }
  .srci { flex: none; display: grid; place-items: center; font-size: 14px; color: var(--fg-muted); }
  .sic { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-size: 14px; }
  .sic.needs { background: var(--session-needs-soft); color: var(--accent-text); }
  .sic.busy { background: var(--session-working-soft); color: var(--session-working); }
  .sic.idle { background: var(--session-idle-soft); color: var(--session-idle); }
  .lw { display: flex; align-items: center; min-width: 0; color: var(--fg-muted); }
  .lw .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lw.fallback .txt { font-style: italic; color: var(--fg-subtle); }
  .lp { min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
  .lp .place { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lc { text-align: right; color: var(--fg-subtle); }
  .lc.wait { color: var(--accent-text); font-weight: 600; }
  @media (max-width: 900px) { .lrow { grid-template-columns: minmax(0, 1fr) auto; } .lw { grid-column: 1 / -1; grid-row: 2; } .lp { display: none; } }

  /* StoppedStrip: a plain card that stays at the bottom of the panel while the lanes scroll. */
  .strip { position: sticky; bottom: 0; z-index: 5; margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 18px;
    background: var(--surface-2); border: 1px solid var(--border); box-shadow: var(--card-sh); font-size: 13px; line-height: 20px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 9999px; font-size: 12px; line-height: 16px;
    font-weight: 500; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
  .chip.off { background: var(--surface-3); border-color: var(--surface-3); }

  /* AppCharacter: Pod Board's own cat, in the round tile of the summary row. Its pose follows the board: needs = waves a paw,
     busy = types, idle = sleeps. Logo colours (--pod-brand-*). */
  .cat { display: block; width: 40px; height: 40px; }
  .cat svg { display: block; width: 100%; height: 100%; overflow: visible; }
  :root[data-theme="dark"] .cat svg { filter: drop-shadow(0 0 .6px var(--fg-subtle)) drop-shadow(0 0 .6px var(--fg-subtle)); }
  .cat .s { fill: var(--pod-brand-cat); }
  .cat .tail, .cat .arm { fill: none; stroke: var(--pod-brand-cat); stroke-linecap: round; }
  .cat .tail { stroke-width: 5; }
  .cat .arm { stroke-width: 7; }
  .cat .arm-gap { fill: none; stroke: var(--side); stroke-width: 10.5; stroke-linecap: round; }
  .cat .paw-gap { fill: var(--side); }
  .cat .eye { fill: var(--pod-brand-eye); } .cat .pupil { fill: var(--pod-brand-cat); }
  .cat .eyes-shut { fill: none; stroke: var(--pod-brand-eye); stroke-width: 1.8; stroke-linecap: round; }
  .cat .screen-glow { fill: var(--pod-brand-eye); fill-opacity: .28; }
  .cat .lid { fill: var(--border-strong); } .cat .lamp { fill: var(--pod-brand-eye); opacity: .7; }
  .cat .zzz text { font: 600 9px var(--font-ui); fill: var(--fg-muted); }
  .cat .bang circle { fill: var(--accent); } .cat .bang text { font: 600 9px var(--font-ui); fill: var(--accent-fg); text-anchor: middle; }
  .cat .eyes-shut, .cat .screen-glow, .cat .laptop, .cat .wave, .cat .zzz, .cat .bang { display: none; }
  .cat.idle .eyes-open { display: none; } .cat.idle .eyes-shut, .cat.idle .zzz { display: inline; }
  .cat.busy .screen-glow, .cat.busy .laptop { display: inline; }
  .cat.needs .wave, .cat.needs .bang { display: inline; }
  .cat .breathe { transform-box: fill-box; transform-origin: center bottom; }
  .cat.idle .breathe { animation: breathe 3.6s ease-in-out infinite; }
  .cat .zzz text { transform-box: fill-box; }
  .cat.idle .zzz text { animation: zfloat 3s ease-in-out infinite; opacity: 0; } .cat.idle .zzz text:nth-child(2) { animation-delay: 1.5s; }
  /* Typing. One 4.2 s cycle: about 3 s of hits (0.28 s each, left and right in turn), then a short pause to read.
     WebKit needs transform-box on SVG groups, or it turns them about the page corner. */
  .cat .tap-l, .cat .tap-r, .cat .head, .cat .pupils, .cat .sparks text, .cat .tail, .cat .screen-glow { transform-box: fill-box; transform-origin: center; }
  .cat .tail { transform-origin: left bottom; }
  .cat .sparks text { font: 400 10px var(--font-code); fill: var(--fg-muted); opacity: 0; }
  .cat .sparks { display: none; } .cat.busy .sparks { display: inline; }

<script>
'use strict';
// Read-only view of Pod Bay sessions. Data: the `pods` event and the `snapshot` command of the app.
// No prompts, replies or paths. Every value goes through textContent.
const STALE_MS = 20000, HOLD_MS = 4000;
// One meaning, one icon (Lucide names). The loader spins wherever it shows.
const STATES = { needs: ['Needs you', 'hand'], busy: ['Working', 'loader'], idle: ['Idle', 'coffee'], stopped: ['Stopped', 'moon-star'] };
// macOS: the window buttons sit on the page's title bar. Elsewhere the app keeps the system's title bar, so the page hides its own.
if (/Mac/.test(navigator.userAgent)) document.documentElement.classList.add('mac');
else if (window.__TAURI__) document.documentElement.classList.add('native-tb');
// One icon from the sprite at the top of the page.
function ic(id) {
  const NS = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(NS, 'svg'); s.setAttribute('class', 'ic'); s.setAttribute('aria-hidden', 'true');
  const u = document.createElementNS(NS, 'use'); u.setAttribute('href', `#i-${id}`); s.append(u);
  return s;
}
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function dur(since) {
  if (!since) return '';
  const m = Math.max(0, Math.round((Date.now() - since) / 60000));
  if (m < 60) return `${m} m`;
  if (m < 1440) return `${Math.floor(m / 60)} h ${m % 60} m`;
  return `${Math.floor(m / 1440)} d ${Math.floor(m % 1440 / 60)} h`;
}
const rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto', style: 'short' });
function ago(since) {
  if (!since) return '';
  const s = Math.round((since - Date.now()) / 1000), a = Math.abs(s);
  if (a < 60) return rtf.format(s, 'second');
  if (a < 3600) return rtf.format(Math.round(s / 60), 'minute');
  if (a < 86400) return rtf.format(Math.round(s / 3600), 'hour');
  return rtf.format(Math.round(s / 86400), 'day');
}
// State pill: soft fill, icon and word.
function pill(state) {
  const p = el('span', `pill ${state}`);
  p.append(ic(STATES[state][1]), STATES[state][0]);
  return p;
}

// Where a session runs. One outline chip for every source: icon and word, no colour per source.
const SRC = { podbay: ['Pod Bay', 'server'], desktop: ['Desktop', 'monitor'], terminal: ['Terminal', 'terminal'] };
const srcOf = s => (SRC[s.source] ? s.source : 'podbay');
// Only a Pod Bay chip names the machine.
const srcWords = s => { const k = srcOf(s); return k === 'podbay' ? (s.machine ? `Pod Bay · ${s.machine}` : 'Pod Bay') : k === 'terminal' ? 'Terminal · RC' : 'Desktop'; };
function srcChip(s) { const c = el('span', 'src'); c.append(ic(SRC[srcOf(s)][1]), el('span', null, srcWords(s))); return c; }
const REASON = { permission: 'Permission', question: 'Question', plan: 'Plan approval' };
// "Permission" in accent text, then the detail in the code font. The detail is often empty: then the kind stands alone.
function whyLine(s, box) {
  const r = s.reason, k = r && REASON[r.kind]; if (!k) return null;
  const p = el('p', box ? 'why box' : 'why'); p.append(el('b', null, k));
  if (r.detail) p.append(el('code', null, r.detail));
  return p;
}
const nSub = n => `${n} sub-agent${n === 1 ? '' : 's'}`;
const subRun = s => { const a = s.agents; if (!a) return 0; return Number(a.running) || (a.list || []).filter(x => !x.done).length; };
const subDone = s => { const a = s.agents; if (!a) return 0; return Number(a.done) || (a.list || []).filter(x => x.done).length; };
function subTag(s) {
  const r = subRun(s), d = subDone(s);

  first = false;
  nav();
  // The cat shows the heaviest state of the whole board, whatever the filter.
  const cat = $('cat'); const k = snap.counts;
  const pose = k.needs > 0 ? 'needs' : k.busy > 0 ? 'busy' : 'idle';
  if (!cat.classList.contains(pose)) cat.className = `cat ${pose}`;
  if (peekOf) {
    const now = snap.sessions.find(x => pkey(x) === pkey(peekOf));
    if (now) { peekOf = now; drawPeekHead(); if (sigOf(now) !== peekSig) { peekSig = sigOf(now); drawPeekBody(); } }
    for (const b of document.querySelectorAll('.peekbtn')) if (b.getAttribute('aria-label') === `Peek at ${peekOf.title}`) b.setAttribute('aria-expanded', 'true');
  }
  const needs = snap.counts.needs;
  if (saidNeeds !== needs) { $('say').textContent = `${needs} sessions need you`; saidNeeds = needs; }
}

// `tip` replaces the label as tooltip and screen reader name; `on` marks a filter row that is switched on.
function item(icon, label, count, active, hot, onClick, dotClass, tip, on) {
  const b = el('button', 'item'); b.type = 'button'; b.title = tip || label; b.setAttribute('aria-label', tip || label);
  if (active) b.setAttribute('aria-current', 'page');
  if (on != null) { b.setAttribute('aria-pressed', String(on)); b.classList.add('sub'); if (on) b.dataset.on = '1'; }
  if (hot) b.dataset.hot = '1';
  const ico = el('span', 'ico'); if (!dotClass) ico.append(ic(icon));
  const dot = dotClass ? el('span', `dot ${dotClass}`) : null; if (dot && tip) dot.title = tip;
  b.append(dot || ico, el('span', 'lbl', label));
  if (count != null) b.append(el('span', 'n tab', String(count)));
  b.addEventListener('click', onClick);
  return b;
}

function nav() {
  const box = $('nav'); const thumb = $('thumb'); const keep = box.scrollTop;
  box.textContent = ''; box.append(thumb);
  // Every state count follows the filters, so a number always matches what the view shows.
  const c = { needs: 0, busy: 0, idle: 0, stopped: 0 };
  if (snap) { for (const s of shown()) c[s.state]++; c.stopped = stoppedShown().length; }
  box.append(item('house', 'Overview', null, view === 'home', false, () => go('home')));
  for (const state of ['needs', 'busy', 'idle', 'stopped']) {
    box.append(item(STATES[state][1], STATES[state][0], c[state], view === state, state === 'needs' && c.needs > 0, () => go(state)));
  }
  if (snap) {
    // Source and Projects: each row is a filter that toggles. Counts here are the whole board, so a row shows what it would add.
    box.append(el('p', 'group', 'Source'));
    for (const k of ['podbay', 'desktop', 'terminal']) {
      const n = snap.sessions.filter(x => srcOf(x) === k).length;
      if (!n && srcF !== k) continue; // a source with no session is left out
      box.append(item(SRC[k][1], SRC[k][0], n, false, false, () => { srcF = srcF === k ? null : k; render(); bar(); }, '', `${SRC[k][0]} sessions`, srcF === k));
    }
    const projects = [...new Set(snap.sessions.map(x => x.project).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    if (projF && !projects.includes(projF)) projects.push(projF);
    if (projects.length) box.append(el('p', 'group', 'Projects'));
    for (const pr of projects) {
      const mine = snap.sessions.filter(x => x.project === pr), w = mine.filter(x => x.state === 'needs').length;
      // The dot is accent when a session there waits; the tooltip and the label say it, and the count turns accent too.
      const tip = w ? `${pr}: ${w} ${w === 1 ? 'session needs' : 'sessions need'} you` : pr;
      box.append(item('', pr, mine.length, false, w > 0, () => { projF = projF === pr ? null : pr; render(); bar(); }, w ? 'hot' : 'quiet', tip, projF === pr));
    }
  }
  if (srcF || projF) {
    const clear = el('button', 'item sub clear'); clear.type = 'button'; clear.title = 'Clear the filter'; clear.setAttribute('aria-label', 'Clear filter');
    const x = el('span', 'ico'); x.append(ic('x')); clear.append(x, el('span', 'lbl', 'Clear filter'));
    clear.addEventListener('click', () => { srcF = null; projF = null; render(); bar(); });
    box.append(clear);
  }
  box.scrollTop = keep; // a redraw every few seconds must not jump the list back to the top
  fadeNav();
  const cur = box.querySelector('[aria-current="page"]');
  if (cur) { thumb.style.transform = `translate(${cur.offsetLeft}px, ${cur.offsetTop}px)`; thumb.style.height = `${cur.offsetHeight}px`; thumb.style.width = `${cur.offsetWidth}px`; }
}

function fadeNav() {
  const n = $('nav');
  n.classList.toggle('fade', n.scrollHeight - n.clientHeight - n.scrollTop > 4);
}
$('nav').addEventListener('scroll', fadeNav);

function go(next) { view = next; if (snap) render(); else nav(); bar(); document.querySelector('main').scrollTo({ top: 0 }); }

function bar() {
  const now = Date.now();
  let s = 'live', text = 'Live';
  if (paused) { s = 'paused'; text = pendingN ? `Paused · ${pendingN} changes` : 'Paused'; }
  else if (!snap) { s = 'wait'; text = 'Reading Pod Bay…'; }
  else if (!snap.ok) { s = 'error'; text = 'Pod Bay error'; }
  else if (!lastMsg || now - lastMsg > STALE_MS) { s = 'stale'; text = 'Stale data'; }
  // #conn is a live region: write it only when the words change, or a screen reader repeats them every second.
  if ($('connText').textContent !== text) { $('conn').dataset.s = s; $('connText').textContent = text; $('conn').parentElement.title = text; }
  $('read').textContent = snap && snap.read_at ? `read at ${new Date(snap.read_at).toLocaleTimeString('en-GB', { hour12: false })}` : '';
  for (const id of ['view', 'summary']) $(id).classList.toggle('dim', s === 'stale' || s === 'error');
  const until = snap && snap.dnd_until;
  $('dnd').hidden = !until;
  if (until) $('dndText').textContent = `Do not disturb until ${new Date(until).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`;
  const b = $('banner');
  if (snap && !snap.ok && snap.error) { b.textContent = `${snap.error} · retrying in 3 s`; b.classList.add('on'); } else if (snap) b.classList.remove('on');
  const name = view === 'home' ? 'Overview' : STATES[view][0];
  const crumb = $('crumb'); crumb.textContent = 'Pod Board › ';
  crumb.append(el('b', null, name));
  if (srcF) crumb.append(` · ${SRC[srcF][0]}`);
  if (projF) crumb.append(` · ${projF}`);
  $('title').textContent = name;
  // A state page names its state with the same pill as the lanes, and the count.
  const ts = $('titleState'); ts.textContent = '';
  if (view !== 'home' && snap) {
    const n = view === 'stopped' ? stoppedShown().length : shown().filter(x => x.state === view).length;
    ts.append(pill(view), el('b', 'tab', String(n)));
  }
}

function apply(m) { snap = m; pending = null; pendingN = 0; render(); bar(); }
// Do not reorder under a moving pointer: hold a new snapshot until the pointer has rested for HOLD_MS.
function offer(m) {
  if (paused || Date.now() - lastMove < HOLD_MS) { pending = m; pendingN++; bar(); } else apply(m);
}
function onSnap(m) {
  if (!m) return;
  if (refreshing) { refreshing = false; drawRefresh(); }
  lastMsg = Date.now();
  // Only the sessions, chips and error decide a redraw; a read with nothing new just moves the read time.
  const body = JSON.stringify([m.sessions, m.stopped, m.machines, m.ok, m.error]);
  if (body === lastBody) { for (const s of [snap, pending]) if (s) { s.ok = m.ok; s.error = m.error; s.read_at = m.read_at; s.dnd_until = m.dnd_until; } }
  else { lastBody = body; offer(m); }
  bar();
}
function connect() {
  const t = window.__TAURI__;
  if (!t) { $('banner').textContent = 'This page runs inside the Pod Board app.'; $('banner').classList.add('on'); return; }
  t.event.listen('pods', e => onSnap(e.payload));
  t.core.invoke('snapshot').then(m => { if (m && (m.read_at || m.error)) onSnap(m); });
}

// Theme: light, dark, or follow the system (no stored choice). The pressed segment shows the current choice.
let stored = null; try { stored = localStorage.getItem('pod-board-theme'); } catch (e) { /* no storage */ }
if (stored !== 'light' && stored !== 'dark') stored = null; // anything else means: follow the system
const media = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const dark = stored ? stored === 'dark' : media.matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  for (const [id, icon, on] of [['th-light', 'sun', stored === 'light'], ['th-dark', 'moon', stored === 'dark'], ['th-system', 'monitor', !stored]]) {
    $(id).replaceChildren(ic(icon)); $(id).setAttribute('aria-pressed', String(on));
  }
}
media.addEventListener('change', () => { if (!stored) applyTheme(); });
for (const [id, value] of [['th-light', 'light'], ['th-dark', 'dark'], ['th-system', null]]) {
  $(id).addEventListener('click', () => {
    stored = value;
    try { if (value) localStorage.setItem('pod-board-theme', value); else localStorage.removeItem('pod-board-theme'); } catch (e) { /* no storage */ }
    applyTheme();
  });
}
applyTheme();

let refreshing = false;
function drawRefresh() { $('refresh').replaceChildren(ic('refresh-cw')); $('refresh').classList.toggle('spin', refreshing); }
$('dndEnd').addEventListener('click', () => {
  const t = window.__TAURI__;
  if (t) t.core.invoke('set_dnd', { minutes: 0 }).catch(() => {});
});
$('refresh').addEventListener('click', () => {
  const t = window.__TAURI__;
  if (!t || refreshing) return;
  refreshing = true; drawRefresh();
  t.core.invoke('refresh').catch(() => {});
  // The spin stops at the next read; a timer stops it too if no read comes.
  setTimeout(() => { refreshing = false; drawRefresh(); }, 6000);
});
drawRefresh();

function drawLayout() {
  for (const [id, name, icon, label] of [['lay-board', 'board', 'layout-grid', 'Board'], ['lay-list', 'list', 'list', 'List']]) {
    $(id).replaceChildren(ic(icon), el('span', null, label));
    $(id).setAttribute('aria-pressed', String(layout === name));
  }
}
for (const name of ['board', 'list']) $(`lay-${name}`).addEventListener('click', () => {
  layout = name; try { localStorage.setItem('pod-board-layout', name); } catch (e) { /* no storage */ }
  drawLayout(); if (snap) render();
});
drawLayout();
$('view').addEventListener('pointermove', () => { lastMove = Date.now(); });
$('view').addEventListener('pointerleave', () => { lastMove = 0; if (pending && !paused) apply(pending); });
function drawPause() { $('pause').replaceChildren(ic(paused ? 'play' : 'pause'), el('span', null, paused ? 'Resume' : 'Pause')); $('pause').setAttribute('aria-label', paused ? 'Resume updates' : 'Pause updates'); }
drawPause();
$('pause').addEventListener('click', () => {
  paused = !paused;
  drawPause();
  $('pause').setAttribute('aria-pressed', String(paused));
  if (!paused && pending) apply(pending); else bar();
});
setInterval(() => { if (pending && !paused && Date.now() - lastMove >= HOLD_MS) apply(pending); bar(); }, 1000);
setInterval(() => {
  for (const e of document.querySelectorAll('[data-since]')) e.textContent = dur(Number(e.dataset.since));
  for (const e of document.querySelectorAll('[data-ago]')) e.textContent = ago(Number(e.dataset.ago));
}, 30000);
window.addEventListener('resize', () => nav());
nav(); connect(); bar();
</script>
</body>
</html>
