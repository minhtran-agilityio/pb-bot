[package]
name = "pod-board"
version = "0.1.0"
description = "A small desktop window that shows every Pod Bay session by state"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# kill(pid, 0): does a local Claude session still run (local.rs). Already in the tree through tauri.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Set the Dock icon of the running app (issue #159). Already in the tree through tauri.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
