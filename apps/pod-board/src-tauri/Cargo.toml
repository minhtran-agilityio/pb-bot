[package]
name = "pod-board"
version = "0.1.0"
description = "A small desktop window that shows every Pod Bay session by state"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
