[package]
name = "pod-shape"
version = "0.1.0"
description = "Shape Board: grill a prototype and turn it into GitHub milestones and issues"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
name = "pod_shape_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true
