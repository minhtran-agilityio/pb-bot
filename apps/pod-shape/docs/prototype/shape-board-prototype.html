<!doctype html>
<html lang="en" class="cozy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shape Board Cozy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ---------- Dark theme (default) ---------- */
:root {
  color-scheme: dark;

  /* Surfaces: from back to front */
  --bg:             #141312; /* window background, main content area */
  --surface-1:      #1A1918; /* sidebar, title bar, right panel */
  --surface-2:      #211F1D; /* cards, inputs, chat bubbles */
  --surface-3:      #2A2725; /* hover, selected row, pressed */
  --overlay:        rgba(8, 7, 6, 0.64); /* behind dialogs */

  /* Lines */
  --border:         #33302D; /* default 1px lines and card borders */
  --border-strong:  #45413D; /* input borders, dividers that must be seen */

  /* Text */
  --fg:             #F4F2EF; /* main text */
  --fg-muted:       #A8A29E; /* secondary text, labels, meta */
  --fg-subtle:      #8E8883; /* placeholder, disabled text, timestamps */

  /* Brand orange from the logo. Logo and app icon only, never UI. */
  --brand:          #F97316;
  --brand-ink:      #18181B;

  /* Accent (logo orange). The ONLY accent color in the UI. */
  --accent:         #F97316; /* primary button, focus ring, active icon */
  --accent-hover:   #FB8A3C;
  --accent-fg:      #1A1817; /* text/icon on --accent */
  --accent-soft:    rgba(249, 115, 22, 0.14); /* selected tint, suggested-answer chip */
  --accent-text:    #FB923C; /* accent used as text/link on --bg */

  /* Issue status (also used for milestones) */
  --status-open:          #3FB97A;
  --status-open-soft:     rgba(63, 185, 122, 0.14);
  --status-running:       #5B9DF5;
  --status-running-soft:  rgba(91, 157, 245, 0.14);
  --status-pr:            #2FB8B0;
  --status-pr-soft:       rgba(47, 184, 176, 0.14);
  --status-merged:        #A884F3;
  --status-merged-soft:   rgba(168, 132, 243, 0.16);
  --status-closed:        #8B94A0;
  --status-closed-soft:   rgba(139, 148, 160, 0.14);

  /* Feedback */
  --danger:         #F06363;
  --danger-soft:    rgba(240, 99, 99, 0.14);
  --warning:        #E8B23F;
  --warning-soft:   rgba(232, 178, 63, 0.14);
  --success:        #3FB97A;

  /* Branch lines (overview tree, pipeline). Node "now" = --accent. */
  --branch:         #5A5550;

  /* Focus */
  --ring:           #F97316;

  /* Shadows (only for things that float: menus, popovers, dialogs, toasts) */
  --elev-sm: 0 2px 8px rgba(0, 0, 0, 0.40), 0 0 0 1px rgba(255, 255, 255, 0.04);
  --elev-lg: 0 16px 48px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.05);

  /* Type */
  --font-ui: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  /* Layout sizes */
  --titlebar-h:  40px;
  --sidebar-w:   240px;
  --panel-w:     360px;
  --content-max: 960px;

  /* Motion */
  --dur-fast: 120ms;  /* hover, press, color change */
  --dur-base: 200ms;  /* open/close menu, dialog, tree expand */
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* ---------- Light theme ---------- */
/* Applied when the OS is light and the user did not force dark,
   or when the user picks light in Settings. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #F5F4F2; --surface-1: #FAF9F7; --surface-2: #FFFFFF; --surface-3: #EBE8E4;
    --overlay: rgba(26, 24, 23, 0.40);
    --border: #DFDBD6; --border-strong: #C9C4BE;
    --fg: #1A1817; --fg-muted: #57534E; --fg-subtle: #6B655F;
    --accent: #C2410C; --accent-hover: #9A3412; --accent-fg: #FFFFFF;
    --accent-soft: rgba(249, 115, 22, 0.12); --accent-text: #C2410C;
    --status-open: #1F8A55;    --status-open-soft: rgba(31, 138, 85, 0.10);
    --status-running: #2163C8; --status-running-soft: rgba(33, 99, 200, 0.10);
    --status-pr: #0E7F79;      --status-pr-soft: rgba(14, 127, 121, 0.10);
    --status-merged: #7044D0;  --status-merged-soft: rgba(112, 68, 208, 0.10);
    --status-closed: #5F6874;  --status-closed-soft: rgba(95, 104, 116, 0.10);
    --danger: #C9302C; --danger-soft: rgba(201, 48, 44, 0.08);
    --warning: #9A6B00; --warning-soft: rgba(154, 107, 0, 0.10);
    --success: #1F8A55;
    --ring: #C2410C;
    --branch: #B5AFA8;
    --elev-sm: 0 2px 8px rgba(26, 24, 23, 0.08), 0 0 0 1px rgba(26, 24, 23, 0.06);
    --elev-lg: 0 16px 48px rgba(26, 24, 23, 0.16), 0 0 0 1px rgba(26, 24, 23, 0.06);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --branch: #B5AFA8;
  --bg: #F5F4F2; --surface-1: #FAF9F7; --surface-2: #FFFFFF; --surface-3: #EBE8E4;
  --overlay: rgba(26, 24, 23, 0.40);
  --border: #DFDBD6; --border-strong: #C9C4BE;
  --fg: #1A1817; --fg-muted: #57534E; --fg-subtle: #6B655F;
  --accent: #C2410C; --accent-hover: #9A3412; --accent-fg: #FFFFFF;
  --accent-soft: rgba(249, 115, 22, 0.12); --accent-text: #C2410C;
  --status-open: #1F8A55;    --status-open-soft: rgba(31, 138, 85, 0.10);
  --status-running: #2163C8; --status-running-soft: rgba(33, 99, 200, 0.10);
  --status-pr: #0E7F79;      --status-pr-soft: rgba(14, 127, 121, 0.10);
  --status-merged: #7044D0;  --status-merged-soft: rgba(112, 68, 208, 0.10);
  --status-closed: #5F6874;  --status-closed-soft: rgba(95, 104, 116, 0.10);
  --danger: #C9302C; --danger-soft: rgba(201, 48, 44, 0.08);
  --warning: #9A6B00; --warning-soft: rgba(154, 107, 0, 0.10);
  --success: #1F8A55;
  --ring: #C2410C;
  --elev-sm: 0 2px 8px rgba(26, 24, 23, 0.08), 0 0 0 1px rgba(26, 24, 23, 0.06);
  --elev-lg: 0 16px 48px rgba(26, 24, 23, 0.16), 0 0 0 1px rgba(26, 24, 23, 0.06);
}

/* Shape Board prototype — component CSS mirrors DESIGN_SYSTEM.md v1.1 (§6) and preview.html.
   Every color comes from tokens; sizes only from the allowed scale. */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:13px;line-height:20px;-webkit-font-smoothing:antialiased}
#root{height:100%}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
::selection{background:var(--accent-soft)}
h1,h2,h3,h4,p{margin:0}
.mono{font-family:var(--font-code)}
.muted{color:var(--fg-muted)} .subtle{color:var(--fg-subtle)}
.label{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-subtle)}
.tnum{font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.lucide{flex:none}

/* Button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;font-weight:500;font-size:13px;line-height:20px;border:1px solid transparent;cursor:pointer;transition:background-color 100ms ease-out,border-color 100ms ease-out,color 100ms ease-out;white-space:nowrap;background:transparent;color:var(--fg)}
.btn.sm{height:28px;padding:0 8px;font-size:12px}
.btn.primary{background:var(--accent);color:var(--accent-fg)} .btn.primary:hover{background:var(--accent-hover)}
.btn.secondary{background:var(--surface-2);border-color:var(--border-strong)} .btn.secondary:hover{background:var(--surface-3)}
.btn.ghost{color:var(--fg-muted)} .btn.ghost:hover{background:var(--surface-3);color:var(--fg)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.icon{width:32px;padding:0} .btn.icon.sm{width:28px}
.btn:active{transform:translateY(1px)}
.btn[disabled],.btn.is-disabled{opacity:.5;pointer-events:none}
.spin{animation:spin 1s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.4}}

/* Tooltip (400ms delay) */
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);right:0;z-index:60;background:var(--surface-3);color:var(--fg);font-size:12px;line-height:16px;font-weight:400;padding:4px 8px;border-radius:6px;box-shadow:var(--elev-sm);white-space:nowrap;pointer-events:none;opacity:0;animation:tipin 100ms ease-out 400ms forwards}
[data-tip-pos="left"]:hover::after{right:auto;left:0}
@keyframes tipin{to{opacity:1}}
/* a disabled button still needs to explain why: wrap it */
.tipwrap{display:inline-flex}

/* Inputs */
.input,.textarea,.select{width:100%;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:6px;color:var(--fg);font-size:13px;line-height:20px;min-width:0}
.input,.select{height:32px;padding:0 12px}
.textarea{padding:6px 12px;resize:vertical;display:block}
.textarea.mono{font-size:12px;line-height:16px}
.input::placeholder,.textarea::placeholder{color:var(--fg-subtle)}
.input.err,.textarea.err{border-color:var(--danger)}
.select{appearance:none;padding-right:32px;cursor:pointer;background-image:none}
.selwrap{position:relative;display:inline-flex;align-items:center}
.selwrap svg{position:absolute;right:8px;pointer-events:none;color:var(--fg-muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:12px;line-height:16px;font-weight:500;color:var(--fg-muted)}
.help{font-size:12px;line-height:16px;color:var(--fg-subtle)}
.help-err{font-size:12px;line-height:16px;color:var(--danger)}

/* Badge / status */
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:4px;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap;flex:none}
.badge.neutral{background:var(--surface-3);color:var(--fg-muted)}
.badge.accent{background:var(--accent-soft);color:var(--accent-text)}
.badge.outline{border:1px solid var(--border);color:var(--fg-muted)}
.st-open{background:var(--status-open-soft);color:var(--status-open)}
.st-running{background:var(--status-running-soft);color:var(--status-running)}
.st-pr{background:var(--status-pr-soft);color:var(--status-pr)}
.st-merged{background:var(--status-merged-soft);color:var(--status-merged)}
.st-closed{background:var(--status-closed-soft);color:var(--status-closed)}
.st-running svg.lucide{animation:spin 1.4s linear infinite}
.dotst{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--fg-muted);white-space:nowrap}
.dotst i{width:8px;height:8px;border-radius:9999px;display:inline-block;flex:none}
.d-open{background:var(--status-open)} .d-running{background:var(--status-running);animation:pulse 1.6s ease-in-out infinite} .d-pr{background:var(--status-pr)} .d-merged{background:var(--status-merged)} .d-closed{background:var(--status-closed)}
.c-open{color:var(--status-open)} .c-running{color:var(--status-running)} .c-pr{color:var(--status-pr)} .c-merged{color:var(--status-merged)} .c-closed{color:var(--status-closed)}
.c-running svg.lucide,svg.lucide.c-running{animation:spin 1.4s linear infinite}
.sbar{display:flex;height:6px;border-radius:9999px;overflow:hidden;background:var(--surface-3);min-width:64px}
.sbar span{display:block;height:100%}
.text-danger{color:var(--danger)} .text-warning{color:var(--warning)} .text-success{color:var(--success)} .text-accent{color:var(--accent)}

/* Card */
.card{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.click{cursor:pointer;text-align:left} .card.click:hover{border-color:var(--border-strong);background:var(--surface-3)}

/* Checkbox / switch */
.checkbox{width:16px;height:16px;border-radius:4px;border:1px solid var(--border-strong);background:var(--surface-2);display:inline-grid;place-items:center;flex:none;cursor:pointer;padding:0;color:var(--accent-fg)}
.checkbox.on{background:var(--accent);border-color:var(--accent)}
.switch{width:32px;height:18px;border-radius:9999px;background:var(--border-strong);position:relative;flex:none;border:0;cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:9999px;background:var(--fg);transition:left 100ms ease-out}
.switch.on{background:var(--accent)} .switch.on::after{left:16px;background:var(--accent-fg)}

/* Tabs */
.tabs{display:flex;gap:16px;border-bottom:1px solid var(--border)}
.tab{padding:8px 0;color:var(--fg-muted);font-weight:500;position:relative;cursor:pointer;background:none;border:0;display:inline-flex;gap:6px;align-items:center}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg)} .tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.kbd{font-family:var(--font-code);font-size:11px;line-height:16px;border:1px solid var(--border);border-radius:4px;padding:0 4px;color:var(--fg-muted)}
.skel{background:var(--surface-3);border-radius:6px;animation:pulse 1.6s ease-in-out infinite}
.sep{border:0;border-top:1px solid var(--border);margin:0;width:100%}

/* App shell */
.app{height:100%;display:grid;grid-template-rows:40px 1fr;min-width:1024px}
.titlebar{background:var(--surface-1);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 12px}
.lights{display:flex;gap:6px} .lights i{width:10px;height:10px;border-radius:9999px;background:var(--border-strong)}
.crumb{display:flex;gap:6px;align-items:center;color:var(--fg-muted);min-width:0}
.crumb button{background:none;border:0;padding:0 2px;color:var(--fg-muted);cursor:pointer;border-radius:4px;white-space:nowrap}
.crumb button:hover{color:var(--fg)}
.crumb b{color:var(--fg);font-weight:500;white-space:nowrap}
.crumb .logo{width:16px;height:16px;flex:none}
.crumb svg.lucide{color:var(--fg-subtle)}
.tb-right{margin-left:auto;display:flex;gap:4px;align-items:center}
.body{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:0;position:relative}
.body:has(> .rpanel){grid-template-columns:240px minmax(0,1fr) 360px}
.sidebar{background:var(--surface-1);border-right:1px solid var(--border);padding:12px 8px;display:flex;flex-direction:column;gap:2px;min-height:0;overflow:auto}
.sidebar .label{padding:12px 8px 4px}
.sitem{height:32px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:6px;color:var(--fg-muted);cursor:pointer;background:none;border:0;width:100%;text-align:left}
.sitem:hover{background:var(--surface-3);color:var(--fg)}
.sitem.on{background:var(--surface-3);color:var(--fg)} .sitem.on svg.lucide{color:var(--accent)}
.sitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem .ct{font-size:12px;color:var(--fg-subtle);font-variant-numeric:tabular-nums}
.sidebar .fill{flex:1}
.sidebar .btn{justify-content:flex-start}
.main{overflow:auto;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.pad{padding:24px 32px;display:flex;flex-direction:column;gap:20px;width:100%}
.readw{max-width:960px}
.ph{display:flex;align-items:flex-start;gap:8px}
.ph .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ph h1{font-size:20px;line-height:28px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph .m{font-size:12px;line-height:16px;color:var(--fg-muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ph .acts{display:flex;gap:8px;align-items:center;flex:none}
.rpanel{background:var(--surface-1);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;min-width:0}
.rp-h{height:40px;display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;border-bottom:1px solid var(--border);font-weight:500;flex:none}
.rp-h .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-b{padding:16px;display:flex;flex-direction:column;gap:16px;overflow:auto;min-height:0}
@media (max-width:1180px){
  .body:has(> .rpanel){grid-template-columns:240px minmax(0,1fr)}
  .rpanel{position:absolute;right:0;top:0;bottom:0;width:360px;z-index:20}
}

/* Projects grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard h3{font-size:14px;line-height:20px;font-weight:500;display:flex;gap:8px;align-items:center}
.pcard .path{font-family:var(--font-code);font-size:12px;line-height:16px;color:var(--fg-subtle);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .foot{display:flex;justify-content:space-between;gap:8px;font-size:12px;line-height:16px;color:var(--fg-muted);font-variant-numeric:tabular-nums}

/* Artifact card */
.alist{display:flex;flex-direction:column;gap:12px}
.acard .r1{display:flex;gap:8px;align-items:center}
.acard .r1 b{font-size:14px;line-height:20px;font-weight:500}
.acard .r1 .time{margin-left:auto;font-size:12px;color:var(--fg-subtle);white-space:nowrap}
.acard p{color:var(--fg-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acard .r3{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.acard .r3 .sbar{width:96px;margin-left:8px}
.acard .r3 .acts{margin-left:auto;display:flex;gap:4px}

/* PipelineSteps */
.pipe{display:flex;align-items:center;font-size:12px;line-height:16px}
.pipe .stp{display:flex;align-items:center;gap:6px;color:var(--fg-subtle);white-space:nowrap}
.pipe .stp i{width:6px;height:6px;border-radius:9999px;border:1.5px solid var(--border-strong);display:inline-block;flex:none}
.pipe .stp.done{color:var(--fg)} .pipe .stp.done i{background:var(--fg-muted);border-color:var(--fg-muted)}
.pipe .stp.now{color:var(--fg);font-weight:500} .pipe .stp.now i{width:8px;height:8px;background:var(--accent);border-color:var(--accent)}
.pipe .ln{width:20px;height:0;border-top:1.5px solid var(--branch);margin:0 6px;flex:none}

/* EmptyState */
.empty{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:8px;max-width:560px}
.empty .t{display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-width:340px}
.empty .t>svg.lucide{color:var(--fg-subtle)}
.empty h2{font-size:16px;line-height:24px;font-weight:600}
.empty .pat{color:var(--branch);width:120px;flex:none}

/* Grill */
.grill{display:flex;flex-direction:column;min-height:0;height:100%}
.grill-h{padding:24px 32px 16px;border-bottom:1px solid var(--border)}
.chat{flex:1;overflow:auto;display:flex;justify-content:center;padding:0 32px;min-height:0}
.chatcol{width:100%;max-width:760px;padding:24px 0;display:flex;flex-direction:column;gap:20px}
.msg-c{display:flex;gap:12px}
.msg-c .av{width:24px;height:24px;border-radius:9999px;background:var(--surface-3);display:grid;place-items:center;flex:none}
.msg-c .av i{width:8px;height:8px;border-radius:9999px;background:var(--fg-muted)}
.msg-c .tx{font-size:14px;line-height:20px;display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.msg-c .tx .why{font-size:13px;color:var(--fg-muted)}
.msg-c .hdr{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-subtle)}
.msg-u{align-self:flex-end;max-width:80%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:14px;line-height:20px;white-space:pre-wrap}
.msg-err{display:flex;gap:8px;align-items:flex-start;color:var(--danger);font-size:13px}
code.inl{font-family:var(--font-code);font-size:12px;background:var(--surface-3);border-radius:4px;padding:1px 4px}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg .c{height:28px;padding:0 12px;border-radius:6px;background:var(--accent-soft);color:var(--accent-text);display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;cursor:pointer;font-size:13px}
.sugg .c:hover{border-color:var(--accent)}
.sugg .c .kbd{color:var(--accent-text);border-color:var(--accent-soft)}
.sugg .own{background:transparent;color:var(--fg-muted);border-color:var(--border)}
.sugg .own:hover{border-color:var(--border-strong);color:var(--fg)}
.optdesc{display:flex;flex-direction:column;gap:2px;font-size:12px;line-height:16px;color:var(--fg-subtle)}
.composer{border-top:1px solid var(--border);padding:12px 32px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--bg);flex:none}
.composer .box{width:100%;max-width:760px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:10px;padding:8px 8px 8px 12px;display:flex;gap:8px;align-items:flex-end}
.composer .box:focus-within{border-color:var(--accent)}
.composer textarea{flex:1;background:transparent;border:0;resize:none;outline:none;line-height:20px;padding:4px 0;max-height:200px;font-size:14px}
.composer textarea::placeholder{color:var(--fg-subtle)}
.composer .hint{width:100%;max-width:760px;display:flex;justify-content:space-between;font-size:12px;line-height:16px;color:var(--fg-subtle)}
.thinking{display:flex;gap:8px;align-items:center;color:var(--fg-muted);font-size:12px}
.brief{display:flex;flex-direction:column;gap:8px}
.brief h3{font-size:14px;line-height:20px;font-weight:500}
.brief h4{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-subtle);margin-top:4px}
.brief ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px;color:var(--fg)}
.brief p{color:var(--fg-muted);overflow-wrap:anywhere}
.sess{display:flex;flex-direction:column;gap:2px}
.sess button{padding:6px 8px;border-radius:6px;display:flex;flex-direction:column;align-items:stretch;background:none;border:0;text-align:left;cursor:pointer;min-height:48px;justify-content:center}
.sess button:hover{background:var(--surface-3)}
.sess button.on{background:var(--surface-3)}
.sess .a{display:flex;gap:8px;align-items:center}
.sess .a span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .b{font-size:12px;line-height:16px;color:var(--fg-subtle)}
.ready{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ready ul{margin:0;padding-left:18px;color:var(--fg-muted);display:flex;flex-direction:column;gap:2px}

/* RunLog */
.runlog{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);overflow:hidden}
.rl{display:flex;align-items:center;gap:8px;min-height:30px;padding:4px 10px;font-family:var(--font-code);font-size:12px;line-height:16px;color:var(--fg-muted);border-bottom:1px solid var(--border);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.rl:last-child{border-bottom:0}
.rl.exp{cursor:pointer} .rl.exp:hover{background:var(--surface-3)}
.rl .a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.rl .t{color:var(--fg-subtle);font-variant-numeric:tabular-nums}
.rl.ok>svg.lucide{color:var(--status-open)} .rl.run>svg.lucide{color:var(--status-running);animation:spin 1.4s linear infinite} .rl.fail>svg.lucide{color:var(--danger)}
.rl-out{padding:8px 10px 8px 32px;background:var(--surface-3);color:var(--fg-muted);white-space:pre;overflow:auto;max-height:192px;font-family:var(--font-code);font-size:12px;line-height:16px;border-bottom:1px solid var(--border)}

/* Review */
.mg{border:1px solid var(--border);border-radius:10px;background:var(--surface-1);overflow:hidden}
.mg-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);min-height:44px}
.mg-h b{font-size:14px;font-weight:500}
.mg-h .r{margin-left:auto;font-size:12px;color:var(--fg-muted);font-variant-numeric:tabular-nums}
.mg-h input.input{height:28px;width:auto;flex:1;max-width:320px}
.ir-wrap{border-bottom:1px solid var(--border)} .ir-wrap:last-child{border-bottom:0}
.ir{display:flex;align-items:center;gap:8px;padding:0 12px;height:40px}
.ir:hover{background:var(--surface-2)}
.ir.off{opacity:.6}
.ir .tt{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:6px;height:28px;padding:0 8px;color:var(--fg);overflow:hidden;text-overflow:ellipsis}
.ir .tt:hover{border-color:var(--border)} .ir .tt:focus{border-color:var(--border-strong);background:var(--surface-2);outline:none}
.ir-body{padding:0 12px 12px 48px;display:flex;flex-direction:column;gap:8px}
.foot{position:sticky;bottom:0;margin-top:auto;background:var(--surface-1);border-top:1px solid var(--border);padding:8px 32px;display:flex;align-items:center;gap:8px;flex:none}
.foot .c{flex:1;color:var(--fg-muted);font-variant-numeric:tabular-nums}
.note{display:flex;gap:8px;align-items:flex-start;color:var(--fg-muted);font-size:12px;line-height:16px}

/* Tree */
.filters{display:flex;gap:8px;align-items:center}
.tree{display:flex;flex-direction:column;outline:none}
.tn{height:28px;display:flex;align-items:center;gap:6px;border-radius:6px;padding-right:8px;cursor:pointer;min-width:0;position:relative}
.tn:hover{background:var(--surface-3)} .tn.on{background:var(--surface-3)}
.tree:focus-visible .tn.on{outline:2px solid var(--ring);outline-offset:-2px}
.tn svg.lucide{color:var(--fg-muted)}
.tn .chev{color:var(--fg-subtle);display:inline-flex;width:14px;flex:none;background:none;border:0;padding:0;cursor:pointer}
.tn .chev svg.lucide{color:var(--fg-subtle)}
.tn .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn .num{font-family:var(--font-code);font-size:12px;color:var(--fg-subtle);flex:none}
.tn .rt{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-muted);font-variant-numeric:tabular-nums;flex:none;padding-left:12px}
.tn .rt .sbar{width:96px}
.tn .br{position:absolute;top:0;bottom:0;border-left:1.5px solid var(--branch);pointer-events:none}
.tn .el{position:absolute;top:0;height:14px;width:7px;border-left:1.5px solid var(--branch);border-bottom:1.5px solid var(--branch);border-bottom-left-radius:6px;pointer-events:none}
.tn .node{position:absolute;top:11px;width:6px;height:6px;border-radius:9999px;background:var(--accent)}
.kv{display:grid;grid-template-columns:88px 1fr;gap:8px 12px;font-size:12px;line-height:16px}
.kv>span:nth-child(odd){color:var(--fg-subtle)}
.link{color:var(--accent-text);text-decoration:none;background:none;border:0;padding:0;cursor:pointer;font-size:inherit;display:inline-flex;gap:6px;align-items:center}
.link:hover{text-decoration:underline}
.pre{font-family:var(--font-code);font-size:12px;line-height:16px;background:var(--surface-3);border-radius:6px;padding:8px 10px;white-space:pre-wrap;color:var(--fg-muted);max-height:240px;overflow:auto;margin:0}

/* Table-ish list (grill history) */
.hlist{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface-1)}
.hrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) 128px 96px 80px;gap:12px;align-items:center;padding:0 12px;height:44px;border-bottom:1px solid var(--border);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.hrow:last-child{border-bottom:0}
.hrow:hover{background:var(--surface-2)}
.hrow.head{cursor:default;height:32px;background:var(--surface-1)} .hrow.head:hover{background:var(--surface-1)}
.hrow .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Dialog */
.overlay{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;z-index:50;padding:24px;animation:fade 200ms ease-out}
.dialog{background:var(--surface-2);border-radius:10px;box-shadow:var(--elev-lg);padding:24px;display:flex;flex-direction:column;gap:16px;width:100%;max-height:calc(100vh - 48px);overflow:auto;animation:dlg 200ms ease-out}
.dialog.sm{max-width:400px} .dialog.md{max-width:560px} .dialog.lg{max-width:800px}
.dialog h2{font-size:16px;line-height:24px;font-weight:600}
.dialog .dfoot{display:flex;justify-content:flex-end;gap:8px}
.dialog .dhead{display:flex;align-items:flex-start;gap:8px}
@keyframes fade{from{opacity:0}}
@keyframes dlg{from{opacity:0;transform:translateY(4px)}}
.frame{width:100%;height:420px;border:1px solid var(--border);border-radius:6px;background:var(--surface-1)}

/* Toast */
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:70}
.toast{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;box-shadow:var(--elev-sm);padding:12px;display:flex;gap:8px;align-items:flex-start;width:340px;animation:dlg 200ms ease-out}
.toast .grow{display:flex;flex-direction:column}
.toast .ic-ok{color:var(--success)} .toast .ic-err{color:var(--danger)}

/* theme segmented control (Settings) */
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden}
.seg button{background:var(--surface-2);color:var(--fg-muted);border:0;height:28px;padding:0 10px;font-size:12px;font-weight:500;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--fg)}
.setrow{display:flex;align-items:center;gap:12px;justify-content:space-between}
/* ================= COZY EXPERIMENT (overrides v1.2, only when html.cozy) ================= */
html.cozy{
  color-scheme: dark;
  --bg:#211A15; --surface-1:#2A211B; --surface-2:#32281F; --surface-3:#3D3128;
  --overlay:rgba(20,14,10,.62);
  --border:#45372D; --border-strong:#584739;
  --fg:#F6ECE0; --fg-muted:#D2C1AE; --fg-subtle:#B4A18B;
  --accent:#EB7D4C; --accent-hover:#F2946A; --accent-fg:#2A1A10;
  --accent-soft:rgba(235,125,76,.16); --accent-text:#F29B70;
  --status-open:#8DBF8A;    --status-open-soft:rgba(141,191,138,.16);
  --status-running:#8EB6D9; --status-running-soft:rgba(142,182,217,.16);
  --status-pr:#7FC1B7;      --status-pr-soft:rgba(127,193,183,.16);
  --status-merged:#C2A3D6;  --status-merged-soft:rgba(194,163,214,.16);
  --status-closed:#B3A595;  --status-closed-soft:rgba(179,165,149,.16);
  --danger:#EE8A7C; --danger-soft:rgba(238,138,124,.16);
  --warning:#E8C06A; --warning-soft:rgba(232,192,106,.16); --success:#8DBF8A;
  --branch:#85705E; --ring:#EB7D4C;
  --elev-sm:0 8px 24px rgba(10,6,3,.35),0 1px 0 rgba(255,240,220,.04) inset;
  --elev-lg:0 28px 64px rgba(10,6,3,.5);
  --card-sh:0 6px 20px rgba(10,6,3,.28);
  --card-sh-hover:0 14px 32px rgba(10,6,3,.38);
  --side:#2C2A1F; /* warm olive sidebar */
  --font-ui:"Outfit",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-card:24px; --r-panel:28px; --r-ctl:9999px; --r-box:18px;
}
@media (prefers-color-scheme: light){
  html.cozy:not([data-theme="dark"]){ color-scheme:light;
    --bg:#F7F0E6; --surface-1:#F2E9DC; --surface-2:#FFFBF5; --surface-3:#F1E6D6;
    --overlay:rgba(59,42,30,.32);
    --border:#EADDCB; --border-strong:#DCCAB3;
    --fg:#33261E; --fg-muted:#5E4E42; --fg-subtle:#6F5F53;
    --accent:#C4552B; --accent-hover:#A9461F; --accent-fg:#FFF8F0;
    --accent-soft:rgba(217,98,43,.13); --accent-text:#AE4A22;
    --status-open:#3F7A4C;    --status-open-soft:#E2EBD8;
    --status-running:#3A6E9C; --status-running-soft:#DDE8F1;
    --status-pr:#2E7770;      --status-pr-soft:#D8EBE6;
    --status-merged:#7A559C;  --status-merged-soft:#ECE1F1;
    --status-closed:#6E6156;  --status-closed-soft:#EDE5DA;
    --danger:#B0412F; --danger-soft:#F7E0D9; --warning:#8F5F0E; --warning-soft:#F6EACB; --success:#3F7A4C;
    --branch:#B9A184; --ring:#C4552B;
    --elev-sm:0 8px 24px rgba(120,80,45,.12),0 1px 2px rgba(120,80,45,.06);
    --elev-lg:0 28px 64px rgba(90,58,30,.20);
    --card-sh:0 4px 16px rgba(120,80,45,.08),0 1px 2px rgba(120,80,45,.05);
    --card-sh-hover:0 12px 28px rgba(120,80,45,.14);
    --side:#E6E8D6;
  }
}
html.cozy[data-theme="light"]{ color-scheme:light;
  --bg:#F7F0E6; --surface-1:#F2E9DC; --surface-2:#FFFBF5; --surface-3:#F1E6D6;
  --overlay:rgba(59,42,30,.32);
  --border:#EADDCB; --border-strong:#DCCAB3;
  --fg:#33261E; --fg-muted:#5E4E42; --fg-subtle:#6F5F53;
  --accent:#C4552B; --accent-hover:#A9461F; --accent-fg:#FFF8F0;
  --accent-soft:rgba(217,98,43,.13); --accent-text:#AE4A22;
  --status-open:#3F7A4C;    --status-open-soft:#E2EBD8;
  --status-running:#3A6E9C; --status-running-soft:#DDE8F1;
  --status-pr:#2E7770;      --status-pr-soft:#D8EBE6;
  --status-merged:#7A559C;  --status-merged-soft:#ECE1F1;
  --status-closed:#6E6156;  --status-closed-soft:#EDE5DA;
  --danger:#B0412F; --danger-soft:#F7E0D9; --warning:#8F5F0E; --warning-soft:#F6EACB; --success:#3F7A4C;
  --branch:#B9A184; --ring:#C4552B;
  --elev-sm:0 8px 24px rgba(120,80,45,.12),0 1px 2px rgba(120,80,45,.06);
  --elev-lg:0 28px 64px rgba(90,58,30,.20);
  --card-sh:0 4px 16px rgba(120,80,45,.08),0 1px 2px rgba(120,80,45,.05);
  --card-sh-hover:0 12px 28px rgba(120,80,45,.14);
  --side:#E6E8D6;
}

/* type: rounder face, one step bigger, softer headings */
html.cozy body{font-size:14px;line-height:22px;letter-spacing:.005em}
html.cozy .label,html.cozy .msg-c .hdr,html.cozy .brief h4{text-transform:none;letter-spacing:0;font-size:12px;font-weight:500}
html.cozy .ph h1{font-size:26px;line-height:34px;font-weight:600;letter-spacing:-.01em}
html.cozy .empty h2,html.cozy .dialog h2{font-size:18px;line-height:26px}
html.cozy .pcard h3,html.cozy .acard .r1 b{font-size:15px;font-weight:600}

/* controls become pills */
html.cozy .btn{height:36px;padding:0 16px;border-radius:var(--r-ctl);font-weight:500;transition:background-color 160ms ease-out,box-shadow 160ms ease-out,transform 160ms ease-out}
html.cozy .btn.sm{height:30px;padding:0 12px}
html.cozy .btn.icon{width:36px;padding:0} html.cozy .btn.icon.sm{width:30px}
html.cozy .btn.primary{box-shadow:0 4px 12px rgba(196,85,43,.25)}
html.cozy .btn.primary:hover{box-shadow:0 6px 16px rgba(196,85,43,.32)}
html.cozy .btn.secondary{border-color:var(--border);box-shadow:var(--card-sh)}
html.cozy .btn:active{transform:scale(.97)}
html.cozy .input,html.cozy .select{height:38px;border-radius:var(--r-ctl);padding:0 16px;border-color:var(--border)}
html.cozy .select{padding-right:36px} html.cozy .selwrap svg{right:12px}
html.cozy .textarea{border-radius:var(--r-box);padding:10px 16px;border-color:var(--border)}
html.cozy .input:focus,html.cozy .textarea:focus,html.cozy .select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
html.cozy .badge{height:22px;padding:0 10px;border-radius:9999px}
html.cozy .checkbox{width:18px;height:18px;border-radius:6px}
html.cozy .switch{width:38px;height:22px} html.cozy .switch::after{width:18px;height:18px}
html.cozy .switch.on::after{left:18px}
html.cozy .kbd{border-radius:6px}
html.cozy .sbar{height:8px}
html.cozy [data-tip]:hover::after{border-radius:12px;padding:6px 10px}

/* tabs: pill segmented track */
html.cozy .tabs{gap:4px;border-bottom:0;background:var(--surface-3);border-radius:9999px;padding:4px;align-self:flex-start;width:max-content;max-width:100%}
html.cozy .tab{padding:6px 14px;border-radius:9999px;transition:background-color 200ms ease-out,color 200ms}
html.cozy .tab.on{background:var(--surface-2);box-shadow:var(--card-sh)}
html.cozy .tab.on::after{display:none}
html.cozy .seg{border:0;background:var(--surface-3);border-radius:9999px;padding:3px;gap:2px}
html.cozy .seg button{background:transparent;border-radius:9999px;height:28px;padding:0 12px}
html.cozy .seg button[aria-pressed="true"]{background:var(--surface-2);box-shadow:var(--card-sh)}

/* cards: soft, round, lifted on hover */
html.cozy .card{border-radius:var(--r-card);padding:20px;gap:10px;border-color:var(--border);box-shadow:var(--card-sh)}
html.cozy .card.click{transition:transform 220ms cubic-bezier(.2,.8,.2,1),box-shadow 220ms,background-color 160ms}
html.cozy .card.click:hover{transform:translateY(-3px);box-shadow:var(--card-sh-hover);background:var(--surface-2);border-color:var(--border)}
html.cozy .pgrid{gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
html.cozy .alist{gap:16px}

/* shell: floating rounded panels on a cream desk */
html.cozy .app{grid-template-rows:48px 1fr;background:var(--bg)}
html.cozy .titlebar{background:var(--bg);border-bottom:0;padding:0 18px}
html.cozy .crumb .logo{width:20px;height:20px}
html.cozy .body{grid-template-columns:256px minmax(0,1fr);padding:0 12px 12px;gap:12px}
html.cozy .body:has(> .rpanel){grid-template-columns:256px minmax(0,1fr) 372px}
html.cozy .sidebar{background:var(--side);border:0;border-radius:var(--r-panel);padding:16px 10px}
html.cozy .sidebar .label{padding:14px 12px 6px}
html.cozy .sitem{height:38px;border-radius:9999px;padding:0 12px;gap:10px}
html.cozy .sitem:hover{background:rgba(255,251,245,.5)}
html.cozy .sitem.on{background:var(--surface-2);box-shadow:var(--card-sh)}
html.cozy .sitem{font-weight:500;color:var(--fg)} html.cozy .sitem.on{font-weight:600}
html.cozy .sidebar .label{font-weight:600;color:var(--fg-muted)}
html.cozy .sitem .ct{font-weight:500}
html.cozy[data-theme="dark"] .sitem:hover{background:rgba(255,240,220,.05)}
@media (prefers-color-scheme: dark){ html.cozy:not([data-theme="light"]) .sitem:hover{background:rgba(255,240,220,.05)} }
html.cozy .main{background:var(--surface-1);border-radius:var(--r-panel)}
html.cozy .pad{padding:32px 40px;gap:24px}
html.cozy .rpanel{background:var(--surface-2);border:0;border-radius:var(--r-panel);box-shadow:var(--card-sh);overflow:hidden}
html.cozy .rp-h{height:52px;border-bottom-color:var(--border);padding:0 10px 0 20px}
html.cozy .rp-b{padding:20px;gap:18px}
@media (max-width:1180px){
  html.cozy .body:has(> .rpanel){grid-template-columns:256px minmax(0,1fr)}
  html.cozy .rpanel{right:12px;bottom:12px;width:372px;box-shadow:var(--elev-lg)}
}

/* pipeline + tree: softer branch */
html.cozy .pipe .stp i{width:8px;height:8px}
html.cozy .pipe .stp.now i{width:10px;height:10px;box-shadow:0 0 0 4px var(--accent-soft)}
html.cozy .pipe .ln{border-top-width:2px;border-radius:2px}
html.cozy .tn{height:34px;border-radius:12px}
html.cozy .tn.on{background:var(--surface-2);box-shadow:var(--card-sh)}
html.cozy .tn .br,html.cozy .tn .el{border-color:var(--branch);border-width:2px}
html.cozy .tn .el{border-bottom-left-radius:8px;height:17px}
html.cozy .tn .node{top:14px}

/* grill */
html.cozy .grill-h{border-bottom:0;padding:28px 40px 12px}
html.cozy .msg-c .av{width:30px;height:30px;background:var(--accent-soft)}
html.cozy .msg-c .av i{background:var(--accent)}
html.cozy .msg-c .tx{font-size:15px;line-height:24px}
html.cozy .msg-u{border-radius:22px 22px 6px 22px;padding:10px 16px;font-size:15px;line-height:24px;border:0;background:var(--surface-2);box-shadow:var(--card-sh)}
html.cozy .sugg{gap:10px}
html.cozy .sugg .c{height:34px;padding:0 16px;border-radius:9999px;transition:transform 160ms,border-color 160ms}
html.cozy .sugg .c:hover{transform:translateY(-1px)}
html.cozy .composer{border-top:0;background:transparent;padding:12px 40px 20px}
html.cozy .composer .box{border-radius:26px;padding:8px 8px 8px 18px;border-color:var(--border);box-shadow:var(--card-sh)}
html.cozy .composer .box:focus-within{box-shadow:0 0 0 4px var(--accent-soft),var(--card-sh)}
html.cozy .ready{border-radius:var(--r-box);padding:16px}
html.cozy .sess button{border-radius:16px;padding:8px 12px}
html.cozy .sess button.on{background:var(--surface-2);box-shadow:var(--card-sh)}
html.cozy code.inl{border-radius:6px;padding:1px 6px}

/* lists, logs, review */
html.cozy .runlog,html.cozy .mg,html.cozy .hlist{border-radius:var(--r-card);box-shadow:var(--card-sh);border-color:var(--border)}
html.cozy .mg,html.cozy .hlist{background:var(--surface-2)}
html.cozy .mg-h{padding:10px 16px;min-height:52px}
html.cozy .ir{padding:0 16px;height:46px}
html.cozy .ir:hover,html.cozy .hrow:hover{background:var(--surface-3)}
html.cozy .ir .tt{border-radius:12px;height:32px}
html.cozy .hrow{height:50px;padding:0 16px}
html.cozy .hrow.head{background:var(--surface-2)} html.cozy .hrow.head:hover{background:var(--surface-2)}
html.cozy .rl{min-height:34px;padding:4px 14px}
html.cozy .pre{border-radius:14px;padding:10px 14px}
html.cozy .foot{background:var(--surface-1);border-top:0;padding:12px 40px;box-shadow:0 -10px 24px -16px rgba(90,58,30,.25)}
html.cozy .frame{border-radius:var(--r-box)}

/* dialogs and toasts */
html.cozy .dialog{border-radius:32px;padding:28px;gap:18px}
html.cozy .dialog.sm{max-width:420px}
html.cozy .toast{border-radius:22px;padding:14px 16px;border-color:var(--border);box-shadow:var(--elev-sm)}
html.cozy .skel{border-radius:12px}
@keyframes dlg{from{opacity:0;transform:translateY(8px) scale(.98)}}

@media (prefers-reduced-motion: reduce){ html.cozy *{transition:none!important} html.cozy .card.click:hover{transform:none} }


/* settings moved to sidebar bottom-left (cozy only) */
.cozy-set{display:none}
html.cozy .tb-right > .tipwrap{display:none}
html.cozy .cozy-set{display:flex;align-items:center;gap:4px;margin-top:6px;padding-top:8px;border-top:1px solid var(--border)}
html.cozy .cozy-set .sitem{flex:1}
html.cozy .cozy-set .th{width:38px;height:38px;flex:none;border-radius:9999px;border:0;background:none;color:var(--fg-muted);display:grid;place-items:center;cursor:pointer}
html.cozy .cozy-set .th:hover{background:rgba(255,251,245,.5);color:var(--fg)}

/* readability pass (Overview + general) */
html.cozy .ph .m{font-size:13px;line-height:20px;color:var(--fg-muted)}
html.cozy .tree{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--card-sh);padding:10px}
html.cozy .tn{height:38px;font-size:14px;padding-right:12px}
html.cozy .tn .nm{font-weight:500;color:var(--fg)}
html.cozy .tn svg.lucide{color:var(--fg-muted)}
html.cozy .tn .rt{font-size:13px;color:var(--fg-muted);gap:10px}
html.cozy .tn .rt .sbar{width:112px}
html.cozy .tn:hover{background:var(--surface-3)}
html.cozy .tn.on{background:var(--accent-soft);box-shadow:none}
html.cozy .tn .node{top:16px}
html.cozy .tn .el{height:19px}
html.cozy .kv{font-size:13px;line-height:20px;grid-template-columns:96px 1fr}
html.cozy .kv>span:nth-child(odd){color:var(--fg-muted)}

.privacy{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--fg-muted);font-size:13px;line-height:20px}
html.cozy .privacy{font-size:14px;line-height:22px}

/* breadcrumb: root item keeps the same box whether it is a link or plain text (no shift when switching pages) */
.crumb>span,.crumb>button{display:inline-block;padding:0 2px;margin:0;border:0;border-radius:4px;font:inherit;letter-spacing:inherit;line-height:20px;color:var(--fg-muted);white-space:nowrap;vertical-align:middle}

/* cozy: one font for paths, repos and numbers; mono only for real code (run log, brief source, inline code, code textareas) */
html.cozy .mono:not(.textarea),html.cozy .pcard .path,html.cozy .tn .num,html.cozy .kbd{font-family:var(--font-ui);font-variant-numeric:tabular-nums}
html.cozy .pcard .path{font-size:13px}

/* Overview: tree levels legend (replaces the arrow text) */
.levels{display:flex;align-items:center;flex-wrap:wrap;gap:0;margin-top:8px}
.levels .lv{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:6px;background:var(--surface-3);color:var(--fg-muted);font-size:12px;line-height:16px;font-weight:500;white-space:nowrap}
.levels .lv svg.lucide{color:var(--fg-subtle)}
.levels .lv-ln{display:inline-block;width:14px;height:0;border-top:1.5px solid var(--branch)}
html.cozy .levels{margin-top:12px}
html.cozy .levels .lv{height:28px;padding:0 12px;border-radius:9999px;background:var(--surface-2);box-shadow:var(--card-sh);font-size:13px;color:var(--fg)}
html.cozy .levels .lv-ln{width:16px;border-top-width:2px}

/* level chips: hover lifts the chip and highlights matching rows in the tree */
.levels .lv{cursor:default;transition:background-color 140ms ease-out,color 140ms ease-out,box-shadow 160ms ease-out,transform 160ms ease-out}
.levels .lv:hover{background:var(--accent-soft);color:var(--accent-text)}
.levels .lv:hover svg.lucide{color:var(--accent-text)}
html.cozy .levels .lv:hover{transform:translateY(-2px);box-shadow:var(--card-sh-hover);background:var(--accent-soft);color:var(--accent-text)}
.tree.lv-on .tn{transition:opacity 140ms ease-out,background-color 140ms ease-out}
.tree.lv-on .tn:not(.lv-hi){opacity:.45}
.tree.lv-on .tn.lv-hi{background:var(--accent-soft)}
@media (prefers-reduced-motion: reduce){.levels .lv{transition:none} html.cozy .levels .lv:hover{transform:none}}
/* ---- Style compare switch (not part of the app) ---- */
.cmp{position:fixed;left:50%;top:7px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:4px;padding:4px;border-radius:9999px;background:var(--surface-2);border:1px solid var(--border-strong);box-shadow:var(--elev-sm);font-family:var(--font-ui);font-size:12px}
.cmp span{padding:0 8px 0 10px;color:var(--fg-muted);font-weight:500}
.cmp button{border:0;background:transparent;color:var(--fg-muted);height:24px;padding:0 12px;border-radius:9999px;cursor:pointer;font:inherit;font-weight:500}
.cmp button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
html.cozy .pcard .foot{position:static;background:none;box-shadow:none;padding:0;border:0;margin-top:0}
